---
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-agentic-operator-metrics
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: lightspeed-agentic-operator
    app.kubernetes.io/component: metrics
spec:
  selector:
    app: lightspeed-agentic-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lightspeed-agentic-operator
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: lightspeed-agentic-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lightspeed-agentic-operator
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: __INTERVAL__
